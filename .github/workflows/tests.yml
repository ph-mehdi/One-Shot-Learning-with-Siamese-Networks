name: Tests

on:
  push:
  pull_request:

jobs:
  cpu-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy>=1.24,<3' 'Pillow>=10,<12'
          python -m pip install 'torch>=2.2,<3' --index-url https://download.pytorch.org/whl/cpu
      - name: Check syntax
        run: python -m compileall -q face_siamese.py tests
      - name: Test pair and triplet training
        run: python -m unittest discover -s tests -v
